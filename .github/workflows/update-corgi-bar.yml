name: update corgi-bar cask

# The corgi-bar repo has no token for this tap, so the tap pulls: every few
# hours, and on demand, it reads the latest corgi-bar release and rewrites
# the cask's version and checksum when they changed.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo Andriiklymiuk/corgi-bar --json tagName -q .tagName)
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CURRENT=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/corgi-bar.rb)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
      - name: Rewrite the cask
        if: steps.rel.outputs.version != steps.rel.outputs.current
        run: |
          V=${{ steps.rel.outputs.version }}
          curl -sSL -o corgi-bar.zip "https://github.com/Andriiklymiuk/corgi-bar/releases/download/v$V/corgi-bar.zip"
          SHA=$(sha256sum corgi-bar.zip | cut -d' ' -f1)
          sed -i "s/^  version \".*\"/  version \"$V\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/corgi-bar.rb
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Casks/corgi-bar.rb
          git commit -m "corgi-bar $V"
          git push
